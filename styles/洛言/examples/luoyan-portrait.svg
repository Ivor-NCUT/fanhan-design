    <text x="52" y="148" fill="#202020" text-anchor="start">过上</text><text x="128" y="148" fill="#00673d" text-anchor="start">理想中</text><text x="242" y="148" fill="#202020" text-anchor="start">的生活</text>
  </g>
  <text x="200" y="193" text-anchor="middle" fill="#777" font-family="PingFang SC, sans-serif" font-size="12">AI Native 公司 · 海外远程 · 小而美的机会</text>
  <rect x="24" y="223" width="352" height="160" rx="14" fill="#fafafa" stroke="#ddd"/>
