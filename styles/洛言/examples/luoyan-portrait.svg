<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1900" viewBox="0 0 400 1900" role="img" aria-label="洛言竖屏长图布局预览">
  <defs>
    <linearGradient id="green" x2="1"><stop stop-color="#00c978"/><stop offset="1" stop-color="#006038"/></linearGradient>
    <linearGradient id="dark" x2="1" y2="1"><stop stop-color="#202020"/><stop offset="1" stop-color="#123e2b"/></linearGradient>
  </defs>
  <rect width="400" height="1900" fill="#f3f3f3"/>
