    <rect x="24" y="1172" width="352" height="240" rx="15" fill="#d9e4db"/>
    <rect x="42" y="1191" width="316" height="200" rx="11" fill="#fff" fill-opacity=".84" stroke="#fff"/>
    <rect x="54" y="1210" width="274" height="37" rx="19" fill="url(#green)"/>
