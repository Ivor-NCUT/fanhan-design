<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泛函标题样式 D</title><style>body{margin:0;background:#e9ebe7;color:#14231f;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1600px;margin:auto;padding:24px}svg{display:block;width:100%;height:auto;box-shadow:0 12px 36px #1728202a}.editable{cursor:text}button{margin-top:20px;padding:10px 16px;background:#087b5a;color:white;border:0;cursor:pointer}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260"><defs><linearGradient id="g"><stop offset="0" stop-color="#176B50"/><stop offset="1" stop-color="#07533F"/></linearGradient></defs><rect width="1200" height="260" fill="#FFFFFF"/><path d="M32 173V83h46" fill="none" stroke="#176B50" stroke-width="3"/><path d="M1122 177h46V87" fill="none" stroke="#082A46" stroke-width="3"/><text class="editable" x="324" y="158" font-family="Songti SC,STSong,serif" font-size="78" font-weight="700" fill="url(#g)">去前沿，</text><text class="editable" x="636" y="158" font-family="Songti SC,STSong,serif" font-size="78" font-weight="700" fill="#082A46">见未来</text></svg><button id="export">导出 SVG</button></main><script>document.querySelectorAll('.editable').forEach(e=>e.addEventListener('click',()=>{const t=prompt('修改文字',e.textContent);if(t!==null)e.textContent=t}));document.querySelector('#export').onclick=()=>{const blob=new Blob([new XMLSerializer().serializeToString(document.querySelector('svg'))],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='D-edited.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
