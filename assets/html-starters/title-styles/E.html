<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泛函标题样式 E</title><style>body{margin:0;background:#e9ebe7;color:#14231f;font-family:-apple-system,"PingFang SC",sans-serif}main{max-width:1600px;margin:auto;padding:24px}svg{display:block;width:100%;height:auto;box-shadow:0 12px 36px #1728202a}.editable{cursor:text}button{margin-top:20px;padding:10px 16px;background:#087b5a;color:white;border:0;cursor:pointer}</style><main><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#FAF9F4"/><rect x="96" y="72" width="112" height="5" fill="#087B5A"/><text class="editable" x="375" y="497" font-family="Songti SC,STSong,serif" font-size="126" font-weight="700" fill="#087B5A">去前沿，</text><text class="editable" x="879" y="497" font-family="Songti SC,STSong,serif" font-size="126" font-weight="700" fill="#14231F">见未来</text><text class="editable" x="96" y="830" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="21" font-weight="500" letter-spacing="3" fill="#628174">FANHAN / EDGE</text></svg><button id="export">导出 SVG</button></main><script>document.querySelectorAll('.editable').forEach(e=>e.addEventListener('click',()=>{const t=prompt('修改文字',e.textContent);if(t!==null)e.textContent=t}));document.querySelector('#export').onclick=()=>{const blob=new Blob([new XMLSerializer().serializeToString(document.querySelector('svg'))],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='E-edited.svg';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
