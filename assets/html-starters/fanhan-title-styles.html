<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>泛函｜引力边缘 · 已选标题样式</title>
<style>
:root{--green:#087b5a;--ink:#14231f;--paper:#faf9f4;--title-green-start:#176b50;--title-green-end:#07533f;--title-blue:#082a46}
*{box-sizing:border-box}body{margin:0;background:#e9ebe7;color:var(--ink);font-family:"Hiragino Sans GB","PingFang SC",sans-serif}main{max-width:1240px;margin:auto;padding:40px 24px 80px}h1{margin:0 0 8px;font-size:28px}p{margin:0 0 30px;color:#52635a;line-height:1.6}.label{display:flex;justify-content:space-between;gap:18px;margin:10px 0 30px;font-size:13px}.label span{color:#52635a}.subtitle{position:relative;background:#fff;min-height:215px;display:flex;align-items:center;justify-content:center;padding:30px 75px}.subtitle .title,.slide .title{font-family:"Songti SC","STSong",serif;font-weight:700;line-height:1.18}.subtitle .title{font-size:clamp(28px,5vw,62px);letter-spacing:.03em}.subtitle .first{background:linear-gradient(90deg,var(--title-green-start),var(--title-green-end));background-clip:text;-webkit-background-clip:text;color:transparent}.subtitle .last{color:var(--title-blue)}.subtitle:before,.subtitle:after{content:"";position:absolute;width:34px;height:70px;top:calc(50% - 35px)}.subtitle:before{left:30px;border-left:2px solid var(--title-green-start);border-top:2px solid var(--title-green-start)}.subtitle:after{right:30px;border-right:2px solid var(--title-blue);border-bottom:2px solid var(--title-blue)}.slide{aspect-ratio:16/9;position:relative;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:8%}.slide .title{font-size:clamp(32px,5.8vw,86px);letter-spacing:.035em;white-space:nowrap}.slide .first{color:var(--green)}.slide .rule{position:absolute;top:8%;left:6%;width:6%;height:4px;background:var(--green)}.slide .credit{position:absolute;bottom:7%;left:6%;font-size:clamp(10px,1.1vw,16px);letter-spacing:.13em;color:#628174}@media(max-width:620px){main{padding:24px 12px 48px}h1{font-size:23px}.subtitle{min-height:160px;padding:20px 44px}.subtitle:before{left:13px}.subtitle:after{right:13px}.subtitle:before,.subtitle:after{width:20px;height:44px;top:calc(50% - 22px)}.slide .title{font-size:clamp(21px,5.8vw,38px)}.label{display:block}.label span{display:block;margin-top:4px}}
</style>
</head>
<body><main>
<h1>已选标题样式</h1><p>两款使用同一句示例标题。D 用于内容小标题；E 用于 16:9 PPT 标题页。正式字体与署名仍待定稿。</p>
<div class="subtitle"><div class="title"><span class="first">去前沿，</span><span class="last">见未来</span></div></div>
<div class="label"><strong>D · 小标题</strong><span>前半句已加深；保留开口角线与分色</span></div>
<div class="slide"><i class="rule"></i><div class="title"><span class="first">去前沿，</span>见未来</div><span class="credit">FANHAN / EDGE</span></div>
<div class="label"><strong>E · PPT 标题页</strong><span>浅暖底、绿色引导线、16:9 比例</span></div>
</main></body></html>
